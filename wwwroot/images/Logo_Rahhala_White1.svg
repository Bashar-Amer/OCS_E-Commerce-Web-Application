<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 320 80 width=100% height=100%>
  <!-- Mountain Peaks & Campfire Emblem -->
  <g transform=translate(10, 8)>
    <!-- Back Peak -->
    <polygon points=32,48 52,18 72,48 fill=#B67961 opacity=0.85/>
    <polygon points=52,18 60,30 52,34 44,30 fill=#FFFFFF opacity=0.9/>
    <!-- Front Peak -->
    <polygon points=12,54 36,12 60,54 fill=#E08D64/>
    <!-- Snowcap -->
    <polygon points=36,12 46,28 36,33 26,28 fill=#FFFFFF/>
    <!-- Stylized Tent / Campfire Emblem at Base -->
    <path d=M 28 54 L 36 40 L 44 54 Z fill=#152A29/>
    <circle cx=36 cy=48 r=3 fill=#E08D64/>
    <!-- Sun / Compass Star -->
    <circle cx=36 cy=6 r=3.5 fill=#E08D64/>
  </g>
  
  <!-- Brand Text (White for Dark Backgrounds) -->
  <g transform=translate(85, 20)>
    <!-- Main Brand Name -->
    <text x=0 y=28 font-family='Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif font-size=28 font-weight=900 letter-spacing=3.5 fill=#FFFFFF>
      RAHHALA
    </text>
    <!-- Subtitle Arabic & English Tagline -->
    <text x=2 y=44 font-family='Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif font-size=9 font-weight=700 letter-spacing=2.5 fill=#E08D64>
      OUTDOOR ADVENTURE
    </text>
  </g>
</svg>
